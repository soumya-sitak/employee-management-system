apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "employee-management.backend.fullname" . }}-deployment

spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "employee-management.backend.fullname" . }}

  template:
    metadata:
      labels:
        app: {{ include "employee-management.backend.fullname" . }}

    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default "Always" }}

          ports:
            - containerPort: {{ .Values.backend.service.port }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          envFrom:
            - configMapRef:
                name: {{ include "employee-management.backend.fullname" . }}-config

            - secretRef:
                name: {{ include "employee-management.backend.fullname" . }}-secret