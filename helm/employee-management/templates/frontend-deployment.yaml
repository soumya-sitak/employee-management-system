apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "employee-management.frontend.fullname" . }}-deployment

spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "employee-management.frontend.fullname" . }}

  template:
    metadata:
      labels:
        app: {{ include "employee-management.frontend.fullname" . }}

    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "Always" }}

          ports:
            - containerPort: {{ .Values.frontend.service.port }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          envFrom:
            - configMapRef:
                name: {{ include "employee-management.frontend.fullname" . }}-config
