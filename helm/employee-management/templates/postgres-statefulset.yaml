apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ include "employee-management.postgres.fullname" . }}

spec:
  serviceName: {{ include "employee-management.postgres.fullname" . }}-service

  replicas: {{ .Values.postgres.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "employee-management.postgres.fullname" . }}

  template:
    metadata:
      labels:
        app: {{ include "employee-management.postgres.fullname" . }}

    spec:
      containers:
      - name: postgres
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"

        ports:
        - containerPort: {{ .Values.postgres.service.port }}

        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata

        envFrom:
        - secretRef:
            name: {{ include "employee-management.postgres.fullname" . }}-secret
        - configMapRef:
            name: {{ include "employee-management.postgres.fullname" . }}-config

        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "admin", "-d", "employee_db"]
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "admin", "-d", "employee_db"]
          initialDelaySeconds: 30
          periodSeconds: 20

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d

      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: {{ include "employee-management.postgres.fullname" . }}-pvc
      - name: postgres-init
        configMap:
          name: {{ include "employee-management.postgres.fullname" . }}-init