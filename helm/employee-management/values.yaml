backend:
  replicaCount: 2

  name: employee-backend

  image:
    repository: soumyasitak/employee-backend
    tag: latest
    pullPolicy: Always

  service:
    port: 5000

frontend:
  replicaCount: 2

  name: employee-frontend

  image:
    repository: soumyasitak/employee-frontend
